# Pages CMS configuration (https://pagescms.org)
# This is what gives the website its point-and-click editor.
# Each section below edits one file in content/; uploads go into media/.

media:
  input: media
  output: media
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, avif, svg, pdf, doc, docx]

content:
  - name: site
    label: Home page & contact
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        required: true
        description: Shown at the top of every page and in the browser tab.
      - name: position
        label: Position
        type: string
        description: Shown just above your name, e.g. "Senior Lecturer in History · University of X".
      - name: intro
        label: Welcome text
        type: text
        description: A sentence or two shown under your name on the home page.
      - name: photo
        label: Your photo
        type: image
        description: Used on the home page and the About page.
      - name: cv
        label: CV
        type: file
        description: Upload a PDF. A "Download CV" button appears when there's one here.
        options:
          extensions: [pdf, doc, docx]
      - name: contactHeading
        label: Contact page heading
        type: string
      - name: email
        label: Email address
        type: string
        description: Shown on the Contact page. Leave empty to hide it.
      - name: links
        label: Links
        description: Google Scholar, ORCID, university profile, etc. Shown on the Contact page. Links with an empty web address are hidden.
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{label}"
        fields:
          - name: label
            label: Name
            type: string
          - name: url
            label: Web address
            type: string

  - name: about
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - name: about
        label: About me
        type: rich-text
        options:
          format: html
      - name: interests
        label: Research interests
        description: Short phrases, shown as tags under your About text.
        type: string
        list: true

  - name: writing
    label: Writing
    description: Your publications and other writing. They're sorted newest first on the site automatically.
    type: file
    path: content/writing.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{year} · {title}"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Type
        type: select
        description: Visitors can filter your writing by type.
        options:
          values: [Book, Edited book, Journal article, Book chapter, Conference paper, Report, Review, Essay or article, Other]
      - name: year
        label: Year
        type: string
        description: e.g. 2025. Words like "Forthcoming" or "In press" are shown at the top.
      - name: authors
        label: Authors (optional)
        type: string
        description: e.g. "With Jane Smith", or the full author list.
      - name: venue
        label: Published in
        type: string
        description: 'Journal, book or publisher, e.g. "Journal of X 12, no. 3 (2025): 45–67".'
      - name: link
        label: Link (optional)
        type: string
        description: A DOI (e.g. 10.1000/xyz123) or web address.
      - name: pdf
        label: PDF (optional)
        type: file
        options:
          extensions: [pdf]
      - name: image
        label: Cover image (optional)
        type: image
        description: Nice for books.
      - name: summary
        label: Summary (optional)
        type: text
        description: A short abstract. Visitors can tap to expand it.
      - name: featured
        label: Show on home page
        type: boolean
        description: Ticked items appear under "Recent writing" on the home page. If none are ticked, the newest three are shown.

  - name: pages
    label: Extra pages
    description: Add any extra pages you like (Teaching, Talks, Projects...). Each appears in the menu, in this order.
    type: file
    path: content/pages.json
    format: json
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: Also used as the menu label.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: html
